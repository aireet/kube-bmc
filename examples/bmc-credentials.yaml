# Default out-of-band credentials for power actions.
# Use with: --set server.credentials.existingSecret=bmc-credentials
# Prefer a dedicated BMC user with the Operator role.
apiVersion: v1
kind: Secret
metadata:
  name: bmc-credentials
  namespace: kube-bmc-system
type: Opaque
stringData:
  username: kube-bmc
  password: change-me

{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-bmc.fullname" . }}-dashboard
  namespace: {{ .Values.grafana.dashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "kube-bmc.labels" . | nindent 4 }}
    {{- with .Values.grafana.dashboard.labels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.grafana.dashboard.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  kube-bmc.json: |-
{{ .Files.Get "dashboards/kube-bmc.json" | indent 4 }}
{{- end }}

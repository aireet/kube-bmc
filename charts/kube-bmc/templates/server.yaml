{{- if .Values.server.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-bmc.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-bmc.fullname" . }}-server
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
rules:
  - apiGroups: ["bmc.kube-bmc.io"]
    resources: ["bmcs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["bmc.kube-bmc.io"]
    resources: ["bmcactions"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["bmc.kube-bmc.io"]
    resources: ["bmcactions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  # Authenticate Kubernetes bearer tokens.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-bmc.fullname" . }}-server
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-bmc.fullname" . }}-server
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-bmc.fullname" . }}-server
    namespace: {{ .Release.Namespace }}
---
# Agent pods and credential Secrets are only read in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-bmc.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-bmc.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-bmc.fullname" . }}-server
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-bmc.fullname" . }}-server
    namespace: {{ .Release.Namespace }}
{{- if and (ne .Values.auth.mode "none") (not .Values.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-bmc.authSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ required "auth.sessionSecret (at least 32 characters) or auth.existingSecret is required" .Values.auth.sessionSecret | quote }}
  {{- if eq .Values.auth.mode "password" }}
  htpasswd: {{ required "auth.password.users or auth.existingSecret is required" (join "\n" .Values.auth.password.users) | quote }}
  {{- end }}
  {{- if eq .Values.auth.mode "oidc" }}
  client-secret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.server.credentials.create (not .Values.server.credentials.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-bmc.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "server.credentials.username is required" .Values.server.credentials.username | quote }}
  password: {{ required "server.credentials.password is required" .Values.server.credentials.password | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-bmc.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels: {{- include "kube-bmc.selector" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels: {{- include "kube-bmc.selector" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- with .Values.server.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kube-bmc.fullname" . }}-server
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: {{ include "kube-bmc.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - --listen=:8080
            - --agent-selector=app.kubernetes.io/name=kube-bmc,app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=agent
            - {{ printf "--agent-port=%v" (.Values.agent.port) | quote }}
            - {{ printf "--stale-after=%v" (.Values.server.staleAfter) | quote }}
            - {{ printf "--log-level=%v" (.Values.server.logLevel) | quote }}
            {{- with .Values.server.clusterName }}
            - {{ printf "--cluster-name=%v" (.) | quote }}
            {{- end }}
            {{- with include "kube-bmc.credentialsSecret" . }}
            - {{ printf "--default-credentials=%v" (.) | quote }}
            {{- end }}
            {{- if .Values.server.powerActions.enabled }}
            - --enable-power-actions
            {{- end }}
            - {{ printf "--action-timeout=%v" (.Values.server.powerActions.timeout) | quote }}
            - {{ printf "--action-ttl=%v" (.Values.server.powerActions.ttl) | quote }}
            {{- with .Values.server.externalURL }}
            - {{ printf "--external-url=%v" (.) | quote }}
            {{- end }}
            - {{ printf "--auth=%v" (.Values.auth.mode) | quote }}
            {{- if ne .Values.auth.mode "none" }}
            - {{ printf "--kubernetes-tokens=%v" (.Values.auth.kubernetesTokens) | quote }}
            - {{ printf "--session-ttl=%v" (.Values.auth.sessionTTL) | quote }}
            {{- end }}
            {{- if eq .Values.auth.mode "password" }}
            - {{ printf "--users-secret=%v" (include "kube-bmc.authSecret" .) | quote }}
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - {{ printf "--oidc-issuer-url=%v" (required "auth.oidc.issuerURL is required" .Values.auth.oidc.issuerURL) | quote }}
            - {{ printf "--oidc-client-id=%v" (.Values.auth.oidc.clientID) | quote }}
            - {{ printf "--oidc-scopes=%v" (.Values.auth.oidc.scopes) | quote }}
            - {{ printf "--oidc-username-claim=%v" (.Values.auth.oidc.usernameClaim) | quote }}
            - {{ printf "--oidc-groups-claim=%v" (.Values.auth.oidc.groupsClaim) | quote }}
            - {{ printf "--oidc-username-prefix=%v" (.Values.auth.oidc.usernamePrefix) | quote }}
            - {{ printf "--oidc-groups-prefix=%v" (.Values.auth.oidc.groupsPrefix) | quote }}
            {{- with .Values.auth.oidc.extraAudiences }}
            - {{ printf "--oidc-extra-audiences=%v" (join "," .) | quote }}
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            {{- if ne .Values.auth.mode "none" }}
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "kube-bmc.authSecret" . }}, key: session-secret } }
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "kube-bmc.authSecret" . }}, key: client-secret } }
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-bmc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector: {{- include "kube-bmc.selector" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      {{- if and (eq .Values.server.service.type "NodePort") .Values.server.service.nodePort }}
      nodePort: {{ .Values.server.service.nodePort }}
      {{- end }}
{{- if .Values.server.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kube-bmc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kube-bmc.labels" . | nindent 4 }}
  {{- with .Values.server.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.server.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.server.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.server.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kube-bmc.fullname" . }}
                port: { name: http }
{{- end }}
{{- end }}

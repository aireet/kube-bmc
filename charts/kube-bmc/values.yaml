image:
  repository: ghcr.io/aireet/kube-bmc
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

agent:
  # The agent reads the local BMC through /dev/ipmi0, which requires a privileged container.
  # It only issues read-only IPMI commands (mc/lan/fru/chassis status, sdr, sel, dcmi).
  enabled: true
  interval: 30s
  inventoryInterval: 10m
  selMinInterval: 5m
  selEntries: 100
  # Readings (power, inlet temperature, SEL counters) are written to the BMC status when
  # they leave their deadband or after this interval. Other changes are written immediately.
  statusRefresh: 10m
  # Validity of the agent heartbeat Lease; renewed every third of it.
  leaseDuration: 3m
  logLevel: info
  port: 9580
  # Run on every node by default, including control planes. Narrow it down with nodeSelector/affinity
  # if some nodes (VMs, cloud instances) have no BMC.
  nodeSelector: {}
  affinity: {}
  tolerations:
    - operator: Exists
  priorityClassName: ""
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  podAnnotations: {}

server:
  enabled: true
  replicas: 1
  logLevel: info
  clusterName: ""
  staleAfter: 10m
  # Public base URL of the dashboard, e.g. https://kube-bmc.example.com. Required for OIDC.
  externalURL: ""
  # Power actions (BMCAction). Shutdown, restart and power cycle are executed by the agent of
  # the target node through its local BMC interface; no BMC credentials are needed. Power on
  # needs out-of-band access (server.credentials). When disabled, actions are rejected.
  # Enable authentication (auth.mode) before enabling power actions.
  powerActions:
    enabled: false
    timeout: 2m
    # How long finished BMCActions are kept as an audit record.
    ttl: 168h
  # Credentials for out-of-band (Redfish / IPMI-over-LAN) access, used by power actions.
  credentials:
    # Name of an existing Secret with `username` and `password` keys in the release namespace.
    existingSecret: ""
    # Or let the chart create one (not recommended for production; prefer existingSecret).
    create: false
    username: ""
    password: ""
  service:
    type: ClusterIP
    port: 80
    # Fixed node port when type is NodePort (30000-32767); empty picks a random one.
    nodePort: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: kube-bmc.example.com
    tls: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
  podAnnotations: {}

auth:
  # none:     no authentication. Use only behind kubectl port-forward or another
  #           authenticating proxy.
  # password: sign-in with usernames and passwords from an htpasswd list.
  # oidc:     sign-in with an OpenID Connect provider.
  # Every authenticated user has full access. See docs/authentication.md.
  mode: none
  # Also accept tokens of ServiceAccounts in the release namespace (API and MCP clients).
  kubernetesTokens: true
  sessionTTL: 12h
  # Existing Secret with the keys:
  #   session-secret  random string of at least 32 bytes (password and oidc)
  #   htpasswd        user list (password)
  #   client-secret   OIDC client secret (oidc)
  existingSecret: ""
  # Used to create the Secret when existingSecret is empty.
  sessionSecret: ""
  password:
    # htpasswd lines, created with `kube-bmc hash-password USERNAME`.
    users: []
  oidc:
    issuerURL: ""
    clientID: kube-bmc
    clientSecret: ""
    scopes: openid,profile,email
    usernameClaim: email
    groupsClaim: groups
    # Prefixes applied to OIDC usernames and groups, like the API server's --oidc-*-prefix flags.
    usernamePrefix: "oidc:"
    groupsPrefix: "oidc:"
    # Additional token audiences accepted from API and MCP clients.
    extraAudiences: []

metrics:
  # Create a PodMonitor for the agents (requires the Prometheus Operator CRDs).
  podMonitor:
    enabled: false
    interval: 60s
    labels: {}

image:
  repository: ghcr.io/aireet/kube-bmc
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

agent:
  # The agent reads the local BMC through /dev/ipmi0, which requires a privileged container.
  # It only issues read-only IPMI commands (mc/lan/fru/chassis status, sdr, sel, dcmi).
  enabled: true
  interval: 30s
  inventoryInterval: 10m
  selMinInterval: 5m
  selEntries: 100
  statusInterval: 2m
  logLevel: info
  port: 9580
  # Run on every node by default, including control planes. Narrow it down with nodeSelector/affinity
  # if some nodes (VMs, cloud instances) have no BMC.
  nodeSelector: {}
  affinity: {}
  tolerations:
    - operator: Exists
  priorityClassName: ""
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  podAnnotations: {}

server:
  enabled: true
  replicas: 1
  logLevel: info
  clusterName: ""
  staleAfter: 10m
  # Public base URL of the dashboard, e.g. https://kube-bmc.example.com. Required for OIDC.
  externalURL: ""
  # Execute BMCActions (power on, off, restart). When disabled, actions are recorded and rejected.
  # Enable authentication (auth.mode=oidc) before enabling power actions.
  powerActions:
    enabled: false
    timeout: 2m
    # How long finished BMCActions are kept as an audit record.
    ttl: 168h
  # Credentials for out-of-band (Redfish / IPMI-over-LAN) access, used by power actions.
  credentials:
    # Name of an existing Secret with `username` and `password` keys in the release namespace.
    existingSecret: ""
    # Or let the chart create one (not recommended for production; prefer existingSecret).
    create: false
    username: ""
    password: ""
  service:
    type: ClusterIP
    port: 80
    # Fixed node port when type is NodePort (30000-32767); empty picks a random one.
    nodePort: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: kube-bmc.example.com
    tls: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
  podAnnotations: {}

auth:
  # none: no authentication; every request has full access.
  # oidc: browser sign-in with OpenID Connect; API and MCP clients send OIDC or Kubernetes
  #       bearer tokens. Authorization uses Kubernetes RBAC (see rbac below).
  mode: none
  # Also accept Kubernetes bearer tokens (ServiceAccount tokens, `kubectl create token`).
  kubernetesTokens: true
  sessionTTL: 12h
  oidc:
    issuerURL: ""
    clientID: kube-bmc
    scopes: openid,profile,email,groups
    usernameClaim: email
    groupsClaim: groups
    # Prefixes applied before RBAC checks, like the API server's --oidc-*-prefix flags.
    usernamePrefix: "oidc:"
    groupsPrefix: "oidc:"
    # Additional token audiences accepted from API and MCP clients.
    extraAudiences: []
    # Existing Secret with the keys client-secret and session-secret (at least 32 bytes).
    existingSecret: ""
    # Used only when existingSecret is empty.
    clientSecret: ""
    sessionSecret: ""

rbac:
  # Subjects bound to the kube-bmc-viewer role (read BMCs, actions and live data).
  # Example: [{kind: Group, name: "oidc:sre", apiGroup: rbac.authorization.k8s.io}]
  viewers: []
  # Subjects bound to the kube-bmc-operator role (viewer plus requesting power actions).
  operators: []
  # Aggregate the viewer role into the built-in "view" ClusterRole.
  aggregateToView: true

metrics:
  # Create a PodMonitor for the agents (requires the Prometheus Operator CRDs).
  podMonitor:
    enabled: false
    interval: 60s
    labels: {}

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write      # keyless signing with Sigstore
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: azure/setup-helm@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4
      - name: Sign the image
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      - name: Package and push the Helm chart
        run: |
          V=${GITHUB_REF_NAME#v}
          sed -i "s/^version:.*/version: $V/; s/^appVersion:.*/appVersion: \"$V\"/" charts/kube-bmc/Chart.yaml
          helm package charts/kube-bmc
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push kube-bmc-$V.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          make manifests
      - name: Build kubectl-bmc
        run: make plugins VERSION=${{ github.ref_name }}
      - name: Sign release artifacts
        run: |
          cosign sign-blob --yes --bundle dist/kubectl-bmc_checksums.txt.sigstore.json dist/kubectl-bmc_checksums.txt
          cosign sign-blob --yes --bundle dist/install.yaml.sigstore.json dist/install.yaml
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/kubectl-bmc_*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/install.yaml
            dist/kubectl-bmc_*.tar.gz
            dist/kubectl-bmc_checksums.txt
            dist/*.sigstore.json
            kube-bmc-*.tgz

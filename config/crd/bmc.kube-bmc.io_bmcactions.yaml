---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: bmcactions.bmc.kube-bmc.io
spec:
  group: bmc.kube-bmc.io
  names:
    kind: BMCAction
    listKind: BMCActionList
    plural: bmcactions
    shortNames:
    - bmca
    singular: bmcaction
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bmcName
      name: BMC
      type: string
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.requestedBy
      name: Requested-By
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BMCAction requests an operation on a BMC: a power action, the identify light, or
          clearing the System Event Log. Each action is executed once, by the node agent in-band
          or by the kube-bmc server out-of-band, and kept as an audit record until its TTL expires.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BMCActionSpec describes a requested operation.
            properties:
              action:
                description: ActionType is an operation on a BMC. Power actions follow
                  the Redfish ResetType names.
                enum:
                - "On"
                - GracefulShutdown
                - GracefulRestart
                - ForceRestart
                - PowerCycle
                - ForceOff
                - IdentifyOn
                - IdentifyOff
                - ClearSEL
                type: string
              bmcName:
                description: BMCName is the name of the target BMC object, which equals
                  the node name.
                minLength: 1
                type: string
              reason:
                description: Reason is a free-form justification recorded for auditing.
                maxLength: 512
                type: string
              requestedBy:
                description: |-
                  RequestedBy is the identity of the requester. The kube-bmc server and kubectl-bmc
                  set it to the authenticated user.
                minLength: 1
                type: string
            required:
            - action
            - bmcName
            - requestedBy
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: BMCActionStatus is the observed state of a BMCAction.
            properties:
              completionTime:
                format: date-time
                type: string
              deadline:
                description: |-
                  Deadline is set by the executor when it starts the action: the time by which it
                  records the outcome. An action still Running after its deadline was interrupted,
                  for example because the executing process stopped, and is marked Failed.
                format: date-time
                type: string
              message:
                type: string
              phase:
                description: ActionPhase is the lifecycle phase of a BMCAction.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Rejected
                type: string
              powerStateBefore:
                description: PowerStateBefore is the power state reported by the node
                  agent when execution started.
                enum:
                - "On"
                - "Off"
                - Unknown
                type: string
              selArchive:
                description: |-
                  SELArchive is the ConfigMap, as namespace/name, that holds the System Event Log
                  saved by ClearSEL before the log was cleared.
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

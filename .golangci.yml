version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [noctx]
formatters:
  enable: [gofmt, goimports]
